# Local infrastructure for development.  Run:  docker compose up -d
# MySQL root password comes from DB_PASSWORD in .env (Compose reads that file automatically).
services:
  mysql:
    image: mysql:8.4
    container_name: cmai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cmai_local_password}
      MYSQL_DATABASE: cmai
    ports:
      - "3306:3306"
    volumes:
      - cmai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-cmai_local_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: a local Redis. By default the app uses REDIS_URL from .env (your Upstash instance).
  # To use this one instead, set REDIS_URL=redis://localhost:6379 and run: docker compose --profile local-redis up -d
  redis:
    image: redis:7-alpine
    container_name: cmai-redis
    restart: unless-stopped
    profiles: ["local-redis"]
    ports:
      - "6379:6379"

volumes:
  cmai_mysql:
